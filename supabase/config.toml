# Ayurplex Supabase local dev config.
# Run `supabase start` (requires Supabase CLI + Docker) to launch.

project_id = "ayurplex-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"
url = "https://accounts.google.com"
skip_nonce_check = false

# ---------------------------------------------------------------------------
# Edge Functions
# ---------------------------------------------------------------------------
[functions.send-reminders]
verify_jwt = false

# ---------------------------------------------------------------------------
# Cron Jobs (production only — local dev uses manual curl trigger)
# ---------------------------------------------------------------------------
# Note: Cron scheduling requires Supabase Pro plan or pg_cron setup.
# For local dev, trigger manually:
#   curl -X POST http://localhost:54321/functions/v1/send-reminders \
#     -H "Authorization: Bearer <SERVICE_ROLE_KEY>"
